<div class="stats">
  <app-magnet-stats-panel
    [source]="loadMagnetStats"
    heading="הפרסומות באתר"
    setupHint='צרו מפתח במגנט (קוד הטמעה ← מפתח סטטיסטיקה לשרת), הזינו אותו במסך "פרסומות מגנט" ושמרו; הנתונים יופיעו כאן.'
    fixKeyLabel='למסך "פרסומות מגנט"'
    (fixKey)="openMagnet.emit()"></app-magnet-stats-panel>

  <nb-card class="danger-card">
    <nb-card-header>
      <h2 class="sa-card-title danger-title">
        <nb-icon icon="alert-triangle-outline"></nb-icon>
        איפוס מוני החיבורים
      </h2>
    </nb-card-header>
    <nb-card-body>
      <p class="sa-lead">
        המערכת סופרת לכל ערוץ כמה קוראים מחוברים בו-זמנית, ושומרת שיא והיסטוריה חודשית — זה מה שמנהלי הערוצים רואים בגרפים שלהם.
        האיפוס מוחק את השיא ואת ההיסטוריה של <strong>כל</strong> הערוצים, ואי אפשר לשחזר.
      </p>
      <button nbButton status="danger" appearance="outline" type="button" (click)="resetStatistics()" [disabled]="resetting">
        <nb-icon icon="refresh-outline"></nb-icon>
        {{ resetting ? 'מאפס…' : 'איפוס מוני החיבורים של כל הערוצים' }}
      </button>
    </nb-card-body>
  </nb-card>
</div>

<div class="ad" [class.collapsed]="collapsed">
  <!-- Laid out like a message header: Magnet's logo where the author's circle
       is, and the name links to Magnet's site (the owner's request, 2026-10-19). -->
  <div class="ad__head">
    <a class="ad__avatar" [href]="magnetUrl" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">
      <img src="/assets/magnet-logo.png" alt="" width="32" height="32" loading="lazy" decoding="async">
    </a>
    <div class="ad__who">
      <a class="ad__name" [href]="magnetUrl" target="_blank" rel="noopener">מגנט</a>
      <span class="ad__meta">
        <span class="ad__badge">פרסומת</span>
        <span class="ad__hint">{{ locked ? 'תוכן ממומן שמוצג על ידי המערכת' : 'תוכן ממומן שמנהלי הערוץ בחרו להציג' }}</span>
      </span>
    </div>
  </div>
  <div class="ad__card">
    <div #host class="magnet-ad-host" [attr.data-slot]="slotKey"></div>
  </div>
</div>
